# Builds and tests the plugin for Windows and Linux on every push and pull request.
# Pushing a version tag (v0.1.0, v1.2.3, ...) also publishes a GitHub release with the
# prebuilt plugin files attached:
#   git tag v0.1.0 && git push origin v0.1.0
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build (and check the DLL needs no VC++ runtime)
        shell: pwsh
        run: ./build.ps1
      - name: Tests
        shell: pwsh
        run: |
          cmake -S . -B build -DLYRICS_BUILD_TESTS=ON
          cmake --build build --config Release --target model_test
          ./build/Release/model_test.exe
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/Release/reaper_lyrics.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # built on an old distro so the .so also loads on older ones (glibc 2.31, GCC 9's libstdc++)
    container: ubuntu:20.04
    steps:
      - name: Tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ make git ca-certificates python3-pip binutils
          pip3 install "cmake>=3.20,<4"
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build (and check glibc / exports)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build.sh
      - name: Tests
        run: |
          cmake -S . -B build-test -DLYRICS_BUILD_TESTS=ON
          cmake --build build-test -j"$(nproc)" --target model_test
          ./build-test/model_test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build-linux/reaper_lyrics.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Close REAPER.
          2. Download the file for your system below:
             - **Windows (64-bit):** `reaper_lyrics.dll`
             - **Linux (x86_64):** `reaper_lyrics.so`
          3. In REAPER, *Options > Show REAPER resource path in explorer/finder*, open the
             `UserPlugins` folder there and put the file in it (keep its name).
          4. Start REAPER. Right-click the track panel > **Insert lyric track**.

          To update, replace the file the same way. The Windows DLL needs no extra runtime
          installs. The Linux build runs on Ubuntu 20.04 / Debian 11 or newer (or any distro
          with glibc 2.31+); on anything else, build from source (see the README).
          EOF
          # the screenshot as of this version, above the install steps
          { printf '![REAPER Lyrics: the lyrics panel and the lyric sequencer](https://raw.githubusercontent.com/%s/%s/docs/screenshot.png)\n\n' "$GITHUB_REPOSITORY" "$TAG"; cat notes.md; } > notes-full.md
          mv notes-full.md notes.md
          gh release create "$TAG" \
            dist/windows-x64/reaper_lyrics.dll \
            dist/linux-x86_64/reaper_lyrics.so \
            --title "REAPER Lyrics $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
